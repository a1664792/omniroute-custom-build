name: docker-custom-build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (tee log)
        run: |
          set -o pipefail
          docker buildx build \
            --build-arg OMNIROUTE_BUILD_WORKERS=1 \
            --push \
            -t ghcr.io/a1664792/omniroute-custom:v3.8.50-patched \
            . 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          retention-days: 1
